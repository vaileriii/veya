  const presets=[8000,16000,32000,64000,128000,200000,1000000];
  const draw=()=>{
    el.innerHTML=topbar('Память и ответы')+`<div class="scroll">
      <div class="group-title">Память (контекст)</div>
      <div class="group"><div class="field"><label>Сколько токенов переписки помнит бот</label>
        <div class="chips" style="margin-top:0">${presets.map(p=>`<button class="chip ${st.contextTokens===p?'on':''}" data-pre="${p}">${p>=1e6?p/1e6+' млн':p/1000+'k'}</button>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:12px"><span style="font-size:15px;color:var(--text2)">Своё:</span><input data-ctx class="numbox" style="flex:1;max-width:none;text-align:left" type="number" inputmode="numeric" min="2000" max="2000000" step="1000" value="${st.contextTokens}"><span style="font-size:15px;color:var(--text2)">токенов</span></div>
        <div class="hint">Это обычная (короткая) память: сколько последних сообщений бот видит целиком. Долгая память с выжимками настраивается в каждом чате отдельно. Чем больше число — тем дороже и медленнее запросы. Место под персонажа и промпт выделяется автоматически, старые сообщения забываются первыми. Не ставьте больше, чем позволяет модель.</div></div></div>
      <div class="group-title">Ответ бота (режим переписки)</div>
      <div class="group">
        <div class="field"><label>Ожидание, если клавиатура закрыта (сек)</label>
        <input data-delay class="numbox" type="number" inputmode="numeric" min="1" max="120" value="${st.replyDelay}"></div>
        <div class="field"><label>Ожидание, если клавиатура открыта (сек)</label>
        <input data-delaykb class="numbox" type="number" inputmode="numeric" min="1" max="300" value="${st.replyDelayKb||10}"></div>
      </div>
      <div class="group-foot">Пока в поле ввода есть недописанный текст, бот не отвечает совсем. Когда поле пустое, бот ждёт указанное время: с открытой клавиатурой дольше, ведь вы, скорее всего, сейчас допишете ещё. В ролплее бот отвечает сразу после отправки.</div>
    </div>`;
    bindBack(el);
    const ctx=$('[data-ctx]',el);
    ctx.onchange=()=>{let v=Math.round(+ctx.value||32000);v=Math.max(2000,Math.min(2000000,v));st.contextTokens=v;save('settings');draw();};
    $$('[data-pre]',el).forEach(b=>b.onclick=()=>{st.contextTokens=+b.dataset.pre;save('settings');draw();});
    const dl=$('[data-delay]',el);
    dl.onchange=()=>{let v=Math.round(+dl.value||4);v=Math.max(1,Math.min(120,v));st.replyDelay=v;save('settings');draw();};
    const dk=$('[data-delaykb]',el);
    dk.onchange=()=>{let v=Math.round(+dk.value||10);v=Math.max(1,Math.min(300,v));st.replyDelayKb=v;save('settings');draw();};
  };
  draw();
}
function greetingEditor(el){

  const draw=()=>{
    el.innerHTML=topbar('Приветствие')+`<div class="scroll">
      <div class="group" style="margin-top:20px"><button class="row" data-tg><span class="label">Стандартное приветствие</span><span class="toggle ${g.enabled?'on':''}"></span></button></div>
      <div class="group-foot">Используется в режиме переписки, когда при создании чата выбрано «Стандартное приветствие». Если выключить — персонаж сам придумает первое сообщение. В ролплее стандартное приветствие не используется.</div>
      ${g.enabled?`<div class="group"><div class="field"><label>Текст</label><textarea data-t>${esc(g.text)}</textarea></div></div>
      <button class="btn secondary" data-reset>Вернуть стандартный текст</button>`:''}
    </div>`;

    $('[data-tg]',el).onclick=()=>{g.enabled=!g.enabled;save('settings');draw();};

function backupScreen(el){
  let withMedia=true;
  const draw=()=>{
  el.innerHTML=topbar('Резервная копия')+`<div class="scroll">
    <div class="group-foot" style="margin-top:16px">Все ваши данные хранятся только в этом приложении на телефоне. Сохраняйте копию время от времени — например, в «Файлы» или iCloud — чтобы ничего не потерять.</div>
    <div class="group"><button class="row" data-wm><span class="label">Вместе с фото, голосовыми и видео</span><span class="toggle ${withMedia?'on':''}"></span></button></div>
    <div class="group-foot">С медиа файл получается тяжелее. Без них переписка сохранится, но вместо фото и голосовых будут пустые места.</div>
    <button class="btn" data-exp>Сохранить копию в файл</button>
    <button class="btn secondary" data-imp>Восстановить из файла</button>
    <div class="group-foot">При восстановлении текущие данные заменяются данными из файла. Копия содержит и ключи API — не отправляйте этот файл другим людям.</div>
  </div>`;
  bindBack(el);
  $('[data-wm]',el).onclick=()=>{withMedia=!withMedia;draw();};
  $('[data-exp]',el).onclick=async()=>{
    const b=$('[data-exp]',el);b.disabled=true;b.innerHTML='<span class="spin"></span> Собираю…';
    try{
      const media={};
      if(withMedia){for(const k of await DB.mediaKeys()){const blob=await DB.getMedia(k);if(blob)media[k]={mime:blob.type,data:await blobToB64(blob)};}}
      const data=JSON.stringify({app:'veya',version:2,exportedAt:Date.now(),settings:S.settings,characters:S.characters,personas:S.personas,chats:S.chats,media});
      const name='veya-backup-'+new Date().toISOString().slice(0,10)+'.json';
      const file=new File([data],name,{type:'application/json'});
      b.disabled=false;b.textContent='Сохранить копию в файл';
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e.name==='AbortError')return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    }catch(e){toast('Ошибка: '+e.message,5000);b.disabled=false;b.textContent='Сохранить копию в файл';}
  };
  $('[data-imp]',el).onclick=async()=>{
    const [f]=await pickFiles('application/json,.json');if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(d.app!=='veya')throw new Error('Это не файл резервной копии Veya');
      if(!await confirmSheet('Заменить все текущие данные данными из файла?','Восстановить'))return;
      toast('Восстанавливаю…',8000);
      await DB.clear();
      S.settings=Object.assign(defaultSettings(),d.settings||{});S.characters=d.characters||[];S.personas=d.personas||[];S.chats=d.chats||[];
      await Promise.all(['settings','characters','personas','chats'].map(save));
      for(const [k,v] of Object.entries(d.media||{}))await DB.putMedia(k,b64ToBlob(v.data,v.mime));
      toast('Данные восстановлены');setTimeout(()=>location.reload(),800);
    }catch(e){toast('Ошибка: '+e.message,5000);}
  };
  };
  draw();
}
function slotLabel(id,emptyLabel='Основная модель чата'){const a=id&&S.settings.apis.find(x=>x.id===id);return a?(a.name||a.model):emptyLabel;}
function pickSlotSheet(title,current,emptyLabel='Основная модель чата'){
  return new Promise(res=>{
    const opts=[{id:null},...S.settings.apis.map(a=>({id:a.id}))];
    sheet({title,actions:opts.map(o=>({label:((o.id||null)===(current||null)?'✓ ':'')+slotLabel(o.id,emptyLabel),onClick:()=>res({id:o.id})}))}).then(i=>{if(i===null||i<0)res(null);});
  });
}
function mediaSettings(el){
  const st=S.settings;
  const draw=()=>{
    const md=st.media,sl=st.slots;
    el.innerHTML=topbar('Фото, голосовые, видео')+`<div class="scroll">
      <div class="group-title">Что можно отправлять</div>
      <div class="group">
        <button class="row" data-t="photo"><span class="label">Фото</span><span class="toggle ${md.photo?'on':''}"></span></button>
        <button class="row" data-t="voice"><span class="label">Голосовые</span><span class="toggle ${md.voice?'on':''}"></span></button>
        <button class="row" data-t="video"><span class="label">Кружочки и видео</span><span class="toggle ${md.video?'on':''}"></span></button>
      </div>
      <div class="group-foot">Если выключить — кнопки пропадут, а бот не будет просить это прислать и даже упоминать. Выключайте то, что ваша модель не понимает.</div>
      <div class="group-title">Какая модель что обрабатывает</div>
      <div class="group">
        <button class="row" data-s="photo"><span class="label">Понимание фото</span><span class="value">${esc(slotLabel(sl.photo))}</span>${IC.chev}</button>
        <button class="row" data-s="voice"><span class="label">Голосовые</span><span class="value">${esc(slotLabel(sl.voice))}</span>${IC.chev}</button>
        <button class="row" data-s="video"><span class="label">Кружочки и видео</span><span class="value">${esc(slotLabel(sl.video))}</span>${IC.chev}</button>
        <button class="row" data-s="imageGen"><span class="label">Генерация картинок</span><span class="value">${esc(slotLabel(sl.imageGen))}</span>${IC.chev}</button>
      </div>
      <div class="group-foot">«Основная модель чата» — файл уходит прямо той модели, с которой идёт переписка. Так работает Gemini: он сам видит фото и слышит голосовые.<br><br>Если переписываетесь с моделью, которая не видит и не слышит (DeepSeek, GLM), выберите здесь подключение с Gemini — он незаметно расшифрует голосовое или опишет фото, а основная модель получит текст.<br><br>Для генерации картинок нужна рисующая модель (например, Gemini с поддержкой изображений). Создайте для неё отдельное подключение в «API подключения».</div>
    </div>`;
    bindBack(el);
    $$('[data-t]',el).forEach(b=>b.onclick=()=>{md[b.dataset.t]=!md[b.dataset.t];save('settings');draw();});
    $$('[data-s]',el).forEach(b=>b.onclick=async()=>{const k=b.dataset.s;const r=await pickSlotSheet({photo:'Модель для фото',voice:'Модель для голосовых',video:'Модель для видео',imageGen:'Модель для генерации картинок'}[k],sl[k]);if(r){sl[k]=r.id;save('settings');draw();}});
  };
  draw();
}
function ltmSettings(el){
  const st=S.settings;
  const draw=()=>{
    el.innerHTML=topbar('Долгая память')+`<div class="scroll">
      <div class="group" style="margin-top:20px"><button class="row" data-api><span class="label">Модель для памяти</span><span class="value">${esc(slotLabel(st.ltm.apiId,'Модель чата'))}</span>${IC.chev}</button></div>
      <div class="group-foot">«Модель чата» — память обновляет та же модель, с которой идёт переписка. Можно выбрать отдельную, например подешевле и побыстрее.</div>
      <div class="group-title">Промпт обновления памяти</div>
      <div class="group"><div class="field"><textarea data-p style="min-height:45vh">${esc(st.ltm.prompt)}</textarea></div></div>
      <div class="group-foot">Подставляются автоматически: {{char}} и {{user}} — имена, {{memory}} — текущая память, {{messages}} — новые сообщения, {{format}} — «переписки» или «ролевой игры». Если убрать {{memory}} или {{messages}}, они всё равно добавятся в конец.</div>
      <button class="btn secondary" data-reset>Вернуть стандартный промпт</button>
    </div>`;
    bindBack(el);
    const ta=$('[data-p]',el);ta.oninput=()=>{st.ltm.prompt=ta.value;save('settings');};
    $('[data-api]',el).onclick=async()=>{const r=await pickSlotSheet('Модель для долгой памяти',st.ltm.apiId,'Модель чата');if(r){st.ltm.apiId=r.id;save('settings');draw();}};
    $('[data-reset]',el).onclick=async()=>{if(!await confirmSheet('Вернуть стандартный промпт памяти?','Вернуть'))return;st.ltm.prompt=DEFAULT_LTM_PROMPT;save('settings');draw();};
  };
  draw();
}
function imageGenScreen(el){
  const st={prompt:'',charId:null,persona:false,extra:[],result:null,loading:false,ctrl:null};
  const draw=()=>{
    const api=(S.settings.slots.imageGen&&S.settings.apis.find(a=>a.id===S.settings.slots.imageGen))||activeApi();
    const ch=st.charId&&charById(st.charId);const pr=personaById(S.settings.activePersonaId);
    el.innerHTML=topbar('Генерация картинок')+`<div class="scroll">
      <div class="group" style="margin-top:16px"><button class="row" data-api><span class="label">Модель</span><span class="value">${esc(slotLabel(S.settings.slots.imageGen,api?(api.name||api.model)+' (основная)':'не настроена'))}</span>${IC.chev}</button></div>
      <div class="group"><div class="field"><label>Что нарисовать</label><textarea data-p style="min-height:140px" placeholder="Например: селфи в зеркале лифта, вечер, неоновый свет, кожаная куртка, лёгкая улыбка">${esc(st.prompt)}</textarea></div></div>
      <div class="group-title">Референсы</div>
      <div class="group">
        <button class="row" data-ch><span class="label">Контакт</span><span class="value">${ch?esc(ch.name)+' ('+((ch.photos||[]).filter(p=>p.ref).length)+' фото)':'не выбран'}</span>${IC.chev}</button>
        <button class="row" data-pr><span class="label">Моя персона${pr?' ('+esc(pr.name)+')':''}</span><span class="toggle ${st.persona?'on':''}"></span></button>
      </div>
      <div class="photos">${st.extra.map((src,i)=>`<div class="ph"><img src="${src}"><button class="x" data-dx="${i}">×</button></div>`).join('')}<button class="ph add" data-addx>+</button></div>
      <div class="group-foot">Внешность берётся с фото-референсов: у контакта — фото с отметкой «референс», у персоны — аватарка. «+» — свои дополнительные картинки.</div>
      <button class="btn" data-go>${st.loading?'<span class="spin"></span> Рисую… (нажмите, чтобы остановить)':'Сгенерировать'}</button>
      ${st.result?`<div style="padding:0 16px"><img data-res src="data:${st.result.mime};base64,${st.result.data}" style="width:100%;border-radius:16px;display:block"></div>
        <button class="btn secondary" data-save>Сохранить на телефон</button><button class="btn secondary" data-send>Отправить в чат</button>`:''}
    </div>`;
    bindBack(el);
    const ta=$('[data-p]',el);ta.oninput=()=>st.prompt=ta.value;
    $('[data-api]',el).onclick=async()=>{const r=await pickSlotSheet('Модель для генерации картинок',S.settings.slots.imageGen);if(r){S.settings.slots.imageGen=r.id;save('settings');draw();}};
    $('[data-ch]',el).onclick=()=>sheet({title:'Чьи фото взять как референс',actions:[{label:'Без контакта',onClick:()=>{st.charId=null;draw();}},...S.characters.map(c=>({label:c.name,onClick:()=>{st.charId=c.id;draw();}}))]});
    $('[data-pr]',el).onclick=()=>{if(!pr||!pr.photo){toast('У активной персоны нет фото');return;}st.persona=!st.persona;draw();};
    $('[data-addx]',el).onclick=async()=>{const fs=await pickFiles('image/*',true);for(const f of fs)st.extra.push(await resizeImage(f,1280));draw();};
    $$('[data-dx]',el).forEach(b=>b.onclick=()=>{st.extra.splice(+b.dataset.dx,1);draw();});
    $('[data-go]',el).onclick=async()=>{
      if(st.loading){st.ctrl&&st.ctrl.abort();return;}
      if(!st.prompt.trim()){toast('Опишите, что нарисовать');return;}
      const refs=[];const toRef=src=>{const [h,b]=src.split(',');return {mime:h.slice(5).split(';')[0],data:b};};
      let note='';
      if(ch){const ps=(ch.photos||[]).filter(p=>p.ref).slice(0,5);ps.forEach(p=>refs.push(toRef(p.src)));if(ps.length)note+=` Внешность ${ch.name} — строго как на первых ${ps.length} изображениях.`;}
      if(st.persona&&pr&&pr.photo){refs.push(toRef(pr.photo));note+=` Внешность ${pr.name} — как на изображении ${refs.length}.`;}
      st.extra.forEach(src=>refs.push(toRef(src)));
      st.loading=true;st.ctrl=new AbortController();draw();
      try{st.result=await callImage(api,st.prompt.trim()+(note?'\n'+note:''),refs,{signal:st.ctrl.signal});}
      catch(e){if(e.name!=='AbortError')toast('❌ '+e.message,7000);}
      st.loading=false;draw();
    };
    const sv=$('[data-save]',el);if(sv)sv.onclick=async()=>{const blob=b64ToBlob(st.result.data,st.result.mime);const file=new File([blob],'veya-'+Date.now()+'.'+(st.result.mime.split('/')[1]||'png'),{type:st.result.mime});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(e){if(e.name==='AbortError')return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();};
    const sd=$('[data-send]',el);if(sd)sd.onclick=()=>{
      if(!S.chats.length){toast('Сначала создайте чат');return;}
      sheet({title:'В какой чат отправить',actions:[...S.chats].sort((a,b)=>lastTs(b)-lastTs(a)).slice(0,12).map(c=>({label:(charById(c.characterId)||{name:'?'}).name+' · '+MODE_NAMES[chatMode(c)],onClick:async()=>{
        const mediaId=await storeMedia(b64ToBlob(st.result.data,st.result.mime));
        c.messages.push({id:uid(),role:'user',type:'photo',mediaId,mime:st.result.mime,text:'',ts:Date.now(),status:'sent'});c.swipe=null;
        await save('chats');toast('Отправлено — откройте чат, чтобы бот ответил');}}))});
    };
    $('[data-res]',el)&&($('[data-res]',el).onclick=()=>viewer([`data:${st.result.mime};base64,${st.result.data}`],0));
  };
  draw();
}

/* =====================================================
   Запуск
   ===================================================== */
(async function start(){
  app.appendChild($('#tabbar'));app.appendChild($('#toast'));
  fitViewport();
  try{await load();}catch(e){document.body.innerHTML='<div class="empty">Не удалось открыть хранилище: '+esc(e.message)+'</div>';return;}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  showTab('chats');
  // обновлять «был(а) N мин назад» в списке
  setInterval(()=>{const t=nav.stack[0];if(t&&nav.tab==='chats'&&nav.stack.length===1)refreshItem(t);},60000);
})();
</script>
