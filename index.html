<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Veya">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Veya AI</title>
<style>
:root{
  --bg:#000;
  --surface:#1c1c1e;
  --surface2:#2c2c2e;
  --surface3:#3a3a3c;
  --sep:rgba(84,84,88,.55);
  --text:#f2f2f4;
  --text2:#8e8e93;
  --text3:#636366;
  --accent:#d7a6b5;
  --accent2:#b98597;
  --accent-dim:rgba(215,166,181,.16);
  --bubble-user:#d9b4c0;
  --bubble-user-text:#231a1d;
  --bubble-user-meta:rgba(35,26,29,.55);
  --bubble-bot:#2b2a2e;
  --bubble-bot-text:#f2f2f4;
  --danger:#ff6b6b;
  --glass:rgba(38,36,40,.62);
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
  --app-h:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
#app{position:fixed;left:0;right:0;top:0;height:var(--app-h);overflow:hidden}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.screen.enter{transform:translateX(100%)}
.screen.leave{transform:translateX(100%)}
.screen.behind{transform:translateX(-25%);opacity:.6}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.with-tabbar .scroll{padding-bottom:calc(90px + var(--sab))}

/* ---------- headers ---------- */
.topbar{padding:calc(var(--sat) + 6px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:44px;
  background:rgba(0,0,0,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--sep);position:relative;z-index:5}
.topbar .title{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .side{min-width:70px;display:flex;align-items:center}
.topbar .side.right{justify-content:flex-end}
.link{color:var(--accent);font-size:17px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px}
.back svg{width:13px;height:21px}
.bigtitle{padding:calc(var(--sat) + 8px) 16px 6px;display:flex;align-items:flex-end;justify-content:space-between}
.bigtitle h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.2px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--accent)}
.iconbtn svg{width:20px;height:20px}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 6px);height:64px;border-radius:32px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:.5px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center;z-index:50;
  transition:transform .3s,opacity .3s}
#tabbar.hidden{transform:translateY(140%);opacity:0;pointer-events:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text2);
  height:52px;justify-content:center;border-radius:26px;margin:0 4px}
#tabbar button svg{width:26px;height:26px}
#tabbar button.active{color:var(--accent);background:rgba(255,255,255,.07)}

/* ---------- lists ---------- */
.group{margin:14px 16px;background:var(--surface);border-radius:14px;overflow:hidden}
.group-title{margin:22px 32px 6px;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.group-foot{margin:-6px 32px 12px;font-size:13px;color:var(--text2);line-height:1.35}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .label{flex:1;font-size:17px}
.row .value{color:var(--text2);font-size:16px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--text3);width:8px;height:14px;flex:none}
.row.danger .label{color:var(--danger)}
.row:active{background:var(--surface2)}
.row .check{color:var(--accent);width:20px;height:20px}

.chatitem{display:flex;gap:12px;padding:9px 16px;align-items:center;position:relative;width:100%;text-align:left}
.chatitem:active{background:var(--surface)}
.chatitem .body{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding-bottom:10px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.chatitem .line1{display:flex;justify-content:space-between;gap:8px}
.chatitem .name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatitem .time{color:var(--text2);font-size:14px;flex:none}
.chatitem .line2{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.chatitem .preview{color:var(--text2);font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chatitem .preview.typing{color:var(--accent)}
.badge{background:var(--accent);color:#231a1d;font-size:14px;font-weight:600;min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:flex;align-items:center;justify-content:center;flex:none;align-self:center}

.avatar{border-radius:50%;object-fit:cover;flex:none;background:linear-gradient(135deg,#7d5a66,#4a3a44);display:flex;align-items:center;justify-content:center;color:#f4e3e9;font-weight:600;overflow:hidden}
.empty{color:var(--text2);text-align:center;padding:60px 32px;line-height:1.45;font-size:16px}

/* ---------- forms ---------- */
.field{padding:10px 16px}
.field+.field{border-top:.5px solid var(--sep)}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:transparent;border:0;outline:0;padding:2px 0;resize:none}
.field textarea{min-height:110px;line-height:1.4}
.field select{-webkit-appearance:none;appearance:none}
.field .hint{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.35}
.selectwrap{position:relative}
.selectwrap::after{content:"";position:absolute;right:2px;top:50%;width:8px;height:8px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:block;width:calc(100% - 32px);margin:14px 16px;padding:14px;border-radius:14px;background:var(--accent);color:#231a1d;font-weight:600;font-size:17px;text-align:center}
.btn.secondary{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--danger)}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:6px 12px;border-radius:16px;background:var(--surface2);font-size:14px;color:var(--text)}
.chip.on{background:var(--accent);color:#231a1d}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 6px;border-radius:7px;font-size:14px;color:var(--text)}
.seg button.on{background:var(--surface3);font-weight:600}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle.on{background:var(--accent2)}
.toggle.on::after{transform:translateX(20px)}

/* photo grid */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:24px;text-align:center}
.ph .ref{position:absolute;left:5px;bottom:5px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.6);color:#ddd;font-size:11px}
.ph .ref.on{background:var(--accent);color:#231a1d;font-weight:600}
.ph.add{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:34px;border:1.5px dashed rgba(215,166,181,.45);background:transparent}

/* ---------- chat ---------- */
.chat{background:#0f0d10}
.chat .wall{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(120% 60% at 15% 10%,rgba(150,105,122,.20),transparent 60%),
   radial-gradient(90% 55% at 90% 75%,rgba(92,110,150,.18),transparent 60%),
   radial-gradient(70% 40% at 30% 95%,rgba(150,105,122,.14),transparent 60%),
   #0f0d10}
.chat .wall::after{content:"";position:absolute;inset:0;opacity:.07;
  background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 1.5px);background-size:22px 22px}
.chathead{position:absolute;top:0;left:0;right:0;z-index:10;padding:calc(var(--sat) + 4px) 10px 6px;display:flex;align-items:center;gap:8px;pointer-events:none}
.chathead > *{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:.5px solid rgba(255,255,255,.08)}
.chathead .hback{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chathead .hback svg{width:12px;height:20px;color:var(--text)}
.chathead .hmid{flex:1;height:46px;border-radius:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 14px}
.chathead .hname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chathead .hstatus{font-size:12.5px;color:var(--text2);margin-top:1px}
.chathead .hstatus.on{color:var(--accent)}
.chathead .havatar{width:46px;height:46px;border-radius:50%;padding:0}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--sat) + 66px) 8px 8px;display:flex;flex-direction:column}
.msgs .spacer-top{flex:1}
.dsep{align-self:center;margin:10px 0 6px;padding:4px 11px;border-radius:12px;font-size:13px;font-weight:500;color:#f0e6ea;background:rgba(80,70,90,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mrow{display:flex;margin-top:2px;padding:0 2px}
.mrow.gap{margin-top:8px}
.mrow.user{justify-content:flex-end}
.bubble{position:relative;max-width:80%;padding:7px 12px 7px 12px;border-radius:18px;font-size:16.5px;line-height:1.32;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mrow.bot .bubble{background:var(--bubble-bot);color:var(--bubble-bot-text)}
.mrow.user .bubble{background:var(--bubble-user);color:var(--bubble-user-text)}
.mrow.bot.tail .bubble{border-bottom-left-radius:5px}
.mrow.user.tail .bubble{border-bottom-right-radius:5px}
.bubble .sp{display:inline-block;width:52px;height:1px}
.mrow.user .bubble .sp{width:70px}
.bubble .edited-sp{width:118px}
.mrow.user .bubble .edited-sp{width:136px}
.meta{position:absolute;right:11px;bottom:5px;font-size:11.5px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.mrow.bot .meta{color:rgba(242,242,244,.45)}
.mrow.user .meta{color:var(--bubble-user-meta)}
.meta svg{width:16px;height:11px}
.bubble.pressed{filter:brightness(1.15);transform:scale(.98);transition:transform .15s}
.errrow{align-self:center;max-width:88%;margin:8px 0;padding:9px 13px;border-radius:14px;background:rgba(120,40,50,.55);color:#ffd9de;font-size:13.5px;line-height:1.35;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.errrow b{display:block;margin-top:6px;color:#fff}
.composer{position:relative;z-index:10;display:flex;align-items:flex-end;gap:8px;padding:6px 10px calc(var(--sab) + 6px)}
.kb .composer{padding-bottom:8px}
.composer .cbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.composer .cbtn svg{width:23px;height:23px}
.composer .inputwrap{flex:1;min-height:44px;border-radius:22px;display:flex;align-items:center;padding:0 14px}
.composer textarea{flex:1;background:transparent;border:0;outline:0;resize:none;max-height:140px;line-height:1.3;padding:11px 0;font-size:16.5px}
.composer textarea::placeholder{color:rgba(242,242,244,.4)}
.composer .send{background:var(--accent);color:#231a1d}

/* ---------- profile ---------- */
.phero{position:relative;width:100%;aspect-ratio:1/1.05;max-height:62vh;background:#1a1719;flex:none;overflow:hidden}
.phero img{width:100%;height:100%;object-fit:cover;display:block}
.phero .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#f4e3e9;background:linear-gradient(135deg,#7d5a66,#3b2f37)}
.phero .shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.phero .bars{position:absolute;top:calc(var(--sat) + 4px);left:10px;right:10px;display:flex;gap:4px}
.phero .bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35)}
.phero .bars i.on{background:#fff}
.phero .tapl,.phero .tapr{position:absolute;top:0;bottom:0;width:40%}
.phero .tapl{left:0}.phero .tapr{right:0}
.phero .pname{position:absolute;left:18px;bottom:16px;right:18px}
.phero .pname h2{margin:0;font-size:30px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.phero .pname div{color:rgba(255,255,255,.75);font-size:16px;margin-top:3px}
.phero .pname div.on{color:var(--accent)}
.overbtn{position:absolute;top:calc(var(--sat) + 16px);height:44px;min-width:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0 14px;z-index:3;color:#fff;font-size:16px;font-weight:600}
.overbtn svg{width:12px;height:20px}
.overbtn.l{left:14px;padding:0}
.overbtn.r{right:14px}
.actions{display:flex;gap:8px;padding:14px 16px 4px}
.actions button{flex:1;background:var(--surface);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--text)}
.actions button svg{width:24px;height:24px;color:var(--accent)}
.card{margin:12px 16px;background:var(--surface);border-radius:14px;padding:12px 16px}
.card .k{font-size:14px;color:var(--text2);margin-bottom:4px}
.card .v{font-size:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.card .v.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card .more{color:var(--accent);font-size:15px;margin-top:6px}
.card + .card{margin-top:-4px}
.tabs{display:flex;gap:4px;margin:16px 16px 0;background:var(--surface);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:15px;color:var(--text2)}
.tabs button.on{background:var(--surface3);color:var(--text);font-weight:600}
.tabpane{margin:10px 16px 30px;color:var(--text2);font-size:15px;text-align:center;padding:26px 10px;background:var(--surface);border-radius:14px;line-height:1.4}

/* ---------- sheets, toasts, modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + 8px);z-index:101;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .sgroup{background:rgba(44,44,46,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
.sheet .stitle{padding:13px 16px;text-align:center;color:var(--text2);font-size:13px;border-bottom:.5px solid var(--sep);line-height:1.35}
.sheet .sbtn{display:block;width:100%;padding:17px;text-align:center;font-size:19px;color:var(--accent)}
.sheet .sbtn + .sbtn{border-top:.5px solid var(--sep)}
.sheet .sbtn.danger{color:var(--danger)}
.sheet .cancel{margin-top:8px;font-weight:600}
.modal{position:fixed;left:8px;right:8px;top:calc(var(--sat) + 10px);bottom:calc(var(--sab) + 10px);z-index:101;background:var(--surface);border-radius:18px;padding:14px;transform:translateY(-20px);opacity:0;transition:all .25s;display:flex;flex-direction:column}
.kb .modal{bottom:10px}
.modal.show{transform:none;opacity:1}
.modal h3{margin:2px 0 10px;font-size:17px;text-align:center}
.modal textarea{width:100%;flex:1;min-height:120px;background:var(--surface2);border:0;border-radius:12px;padding:12px;outline:0;resize:none;line-height:1.45;font-size:16.5px}
.modal .mbtns{display:flex;gap:8px;margin-top:10px}
.modal .mbtns button{flex:1;padding:12px;border-radius:12px;background:var(--surface2);color:var(--accent);font-weight:600}
.modal .mbtns button.pri{background:var(--accent);color:#231a1d}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,calc(-100% - var(--sat) - 40px));opacity:0;z-index:200;max-width:90%;padding:10px 16px;border-radius:14px;
  background:rgba(50,48,54,.95);color:var(--text);font-size:14.5px;line-height:1.35;transition:transform .3s,opacity .3s;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
/* всё «плавающее» живёт внутри #app, чтобы не съезжало на iOS 26 */
.overlay,.sheet,.modal,#tabbar{position:absolute!important}
/* просмотр фото */
.viewer{position:absolute;inset:0;z-index:150;background:#000;opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
.viewer.show{opacity:1}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.viewer .vtop{position:absolute;top:calc(var(--sat) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.viewer .vtop button{height:40px;min-width:40px;padding:0 14px;border-radius:20px;color:#fff;font-size:15px;font-weight:600}
.viewer .vcount{color:rgba(255,255,255,.8);font-size:15px}
.viewer .vl,.viewer .vr{position:absolute;top:15%;bottom:15%;width:35%}
.viewer .vl{left:0}.viewer .vr{right:0}
.viewer .vbottom{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 16px);display:flex;justify-content:center}
.viewer .vbottom button{padding:12px 20px;border-radius:22px;color:#fff;font-weight:600}
/* пометка режима */
.modepill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;margin-left:6px;vertical-align:2px;letter-spacing:.2px}
.modepill.chat{background:var(--accent-dim);color:var(--accent)}
.modepill.rp{background:rgba(140,160,210,.16);color:#a9b8de}
/* роллплей */
.chat.rp .msgs{padding-left:10px;padding-right:10px}
.rpcard{margin-top:10px;padding:12px 14px;border-radius:16px;font-size:16.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:rgba(43,42,46,.92)}
.rpcard.user{background:rgba(217,180,192,.16);border:.5px solid rgba(217,180,192,.25)}
.rpcard .who{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
.rpcard.user .who{color:#e8cbd4}
.rpcard em{color:#cfc7cc}
.rpcard.pressed{filter:brightness(1.15)}
.typingdots{display:inline-flex;gap:5px;padding:14px 16px;border-radius:16px;background:rgba(43,42,46,.92);margin-top:10px;align-self:flex-start}

function inlineMd(t){
  const codes=[];
  t=t.replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  t=t.replace(/\*\*\*([^*\n]+?)\*\*\*/g,'<b><em>$1</em></b>')
     .replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>')
     .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>')
     .replace(/(^|[\s(«"])_([^_\n]+?)_(?=[\s.,!?:;)»"]|$)/g,'$1<em>$2</em>')
     .replace(/~~([^~\n]+?)~~/g,'<s>$1</s>');
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[+i]+'</code>');
}
function md(text){
  let t=esc(text||'');
  const blocks=[];
  t=t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c.replace(/\n$/,''));return '\u0001'+(blocks.length-1)+'\u0001';});
  const lines=t.split('\n');const out=[];let q=[];
  const flush=()=>{if(q.length){out.push('<blockquote>'+q.map(inlineMd).join('<br>')+'</blockquote>');q=[];}};
  for(const l of lines){const m=l.match(/^&gt;\s?(.*)$/);if(m)q.push(m[1]);else{flush();out.push(inlineMd(l));}}
  flush();
  t=out.join('\n').replace(/<\/blockquote>\n/g,'</blockquote>');
  return t.replace(/\u0001(\d+)\u0001/g,(m,i)=>'<pre><code>'+blocks[+i]+'</code></pre>');
}

async function toWavB64(blob){

async function docxText(file){
  const buf=new Uint8Array(await file.arrayBuffer());const dv=new DataView(buf.buffer);
  let eocd=-1;for(let i=buf.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}

  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),loff=dv.getUint32(p+42,true);

      let xml;
      if(method===0)xml=td.decode(data);
      else{const ds=new DecompressionStream('deflate-raw');xml=await new Response(new Blob([data]).stream().pipeThrough(ds)).text();}
      return xml.replace(/<w:tab\/>/g,'\t').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim();
    }
    p+=46+nl+el+cl;
  }

function protocolOf(api){
  if(api.protocol&&api.protocol!=='auto')return api.protocol;
  const u=(api.baseUrl||'').toLowerCase();
  if(u.includes('v1beta')||u.includes('generativelanguage'))return 'gemini';
  if(u.includes('anthropic'))return 'anthropic';
  return 'openai';
}
const PROTO_NAMES={auto:'Определить автоматически',openai:'OpenAI Chat Completions',anthropic:'Anthropic Messages',gemini:'Google Gemini'};
function joinUrl(base,path){return (base||'').trim().replace(/\/+$/,'')+'/'+path;}
function cleanModel(m){return (m||'').trim().replace(/^models\//,'');}
function apiHeaders(api,proto){

async function httpJson(url,opts){

    throw new Error('Ошибка '+res.status+': '+msg);
  }
  if(data===null)throw new Error('Сервер вернул не JSON: '+text.slice(0,200));
  return data;
}
async function fetchModels(api){
  const proto=protocolOf(api);

  if(proto==='gemini')url+='?pageSize=1000&key='+encodeURIComponent((api.key||'').trim());
  const data=await httpJson(url,{headers:apiHeaders(api,proto)});
  let list=[];
  if(Array.isArray(data.models))list=data.models.map(m=>cleanModel(m.name||m.id));
  else if(Array.isArray(data.data))list=data.data.map(m=>cleanModel(m.id||m.name));

function canAccept(api,mime){

  if(p==='anthropic')return /^image\//.test(mime)||mime==='application/pdf';

function normalizeTurns(turns){

    if(last&&last.role===t.role){last.text=[last.text,t.text].filter(Boolean).join('\n');last.media=last.media.concat(t.media||[]);}

// Генерация картинки. refs: [{mime,data}]. Возвращает {mime,data}
async function callImage(api,prompt,refs=[],{signal}={}){
  checkApi(api);

  const headers=Object.assign({'Content-Type':'application/json'},apiHeaders(api,proto));
  if(proto==='gemini'){
    const url=joinUrl(api.baseUrl,'models/'+encodeURIComponent(model)+':generateContent')+'?key='+encodeURIComponent(api.key.trim());
    const body={contents:[{role:'user',parts:[...refs.map(m=>({inline_data:{mime_type:m.mime,data:m.data}})),{text:prompt}]}],

    const data=await httpJson(joinUrl(api.baseUrl,'chat/completions'),{method:'POST',headers,body:JSON.stringify(body),signal});

    if(url)return await urlToImage(url);

  const d=data.data&&data.data[0];
  if(d&&d.b64_json)return {mime:'image/png',data:d.b64_json};

function buildPrompt(chat,{first=false,cont=false,inline={}}={}){

async function prepareMedia(chat,mainApi,signal,onStep){

function parseReply(raw,charName,mode){

  if(mode==='rp'){
    t=t.replace(/^\((прошло|продолжи|это начало)[^)]*\)\s*/i,'').replace(namePrefix,'');

  }
  if(/^\[?\s*игнор\s*\]?\.?$/i.test(t))return {ignore:true};
  t=t.replace(/(^|[^*])\*(?!\*)[^*\n]+\*(?!\*)/g,'$1'); // убираем *действия*
  const out=[];
  for(let l of t.split(/\n+/)){

    if(!l||/^\[\s*игнор\s*\]$/i.test(l))continue;

  return (users.find(m=>m.text.toLowerCase().includes(f))||users.find(m=>{const w=f.split(/\s+/).slice(0,2).join(' ');return w&&m.text.toLowerCase().includes(w);})||{}).id||null;
}

const presenceTimers={};
function isOnline(chat){return !!(chat.presence&&chat.presence.online);}
function setOnline(chat,on,forMs){
  chat.presence=chat.presence||{};
  if(chat.presence.online&&!on)chat.botLastSeen=Date.now();
  chat.presence.online=on;
  if(on)chat.botLastSeen=Date.now();
  clearTimeout(presenceTimers[chat.id]);
  if(on&&forMs)presenceTimers[chat.id]=setTimeout(()=>{if(!generating.has(chat.id)){setOnline(chat,false);save('chats');chatChanged(chat.id);}},forMs);
  save('chats');chatChanged(chat.id);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function realistic(chat){return chatMode(chat)==='chat'&&chat.realism!==false;}
function onChatOpened(chat){
  if(!realistic(chat)){if(!isOnline(chat))setOnline(chat,true);return;}
  const last=chat.messages[chat.messages.length-1];
  const active=last&&Date.now()-last.ts<10*6e4;
  if(active)return;
  if(Math.random()<.5)setOnline(chat,true,rnd(60,240)*1000);else setOnline(chat,false);
}
function presenceTick(chat){
  if(!realistic(chat)||generating.has(chat.id)||replyTimers[chat.id])return;
  const last=chat.messages[chat.messages.length-1];
  if(last&&Date.now()-last.ts<3*6e4)return;
  if(!isOnline(chat)&&Math.random()<.08)setOnline(chat,true,rnd(30,90)*1000);
}

/* =====================================================
   Генерация ответа
   ===================================================== */
const generating=new Set();
const replyTimers={};
const aborters={};      // chatId -> AbortController текущего ответа
const busyLabel={};     // chatId -> 'смотрит фото…' и т.п.
function chatChanged(chatId){
  nav.stack.forEach(it=>{if(it.el.chatId===chatId||it.el.listensChats)refreshItem(it);});
}
const composers={};
function replyDelayFor(chatId){
  const chat=chatById(chatId);const ta=composers[chatId];
  if(chatMode(chat)==='rp')return 600;
  const kb=ta&&document.activeElement===ta;
  let d=(kb?(S.settings.replyDelayKb||10):(S.settings.replyDelay||4))*1000;
  if(realistic(chat)&&!isOnline(chat))d=Math.max(d,rnd(8,45)*1000);
  return d;
}
function scheduleReply(chatId,delay){
  clearTimeout(replyTimers[chatId]);
  replyTimers[chatId]=setTimeout(()=>{
    const ta=composers[chatId];
    if(ta&&ta.isConnected&&ta.value.trim()){scheduleReply(chatId,1500);return;}
    if(recorder&&recorder.chatId===chatId){scheduleReply(chatId,1500);return;} // юзер записывает голосовое/кружок
    delete replyTimers[chatId];generate(chatId);
  },delay??replyDelayFor(chatId));
}
function stopGeneration(chatId){
  const a=aborters[chatId];if(a)a.abort();
  clearTimeout(replyTimers[chatId]);delete replyTimers[chatId];
}
function imageApi(chat){const id=S.settings.slots.imageGen;return (id&&S.settings.apis.find(a=>a.id===id))||chatApi(chat);}
async function photoRefs(chat,together){
  const ch=charById(chat.characterId);const refs=[];
  for(const p of (ch.photos||[]).filter(p=>p.ref).slice(0,5)){const [h,b]=p.src.split(',');refs.push({mime:h.slice(5).split(';')[0],data:b});}
  let personaRef=false;
  if(together){const pr=personaById(chat.personaId)||personaById(S.settings.activePersonaId);
    if(pr&&pr.photo){const [h,b]=pr.photo.split(',');refs.push({mime:h.slice(5).split(';')[0],data:b});personaRef=true;}}
  return {refs,charCount:refs.length-(personaRef?1:0),personaRef};
}
function photoPrompt(chat,desc,{charCount,personaRef}){
  const ch=charById(chat.characterId);const pr=personaById(chat.personaId)||personaById(S.settings.activePersonaId);
  let p=`Реалистичная фотография, снятая на камеру телефона, как будто её только что прислали в мессенджере. Естественный свет, лёгкий шум и несовершенства любительского снимка, без студийного глянца.`;
  if(charCount)p+=` На фото ${ch.name}: внешность (лицо, причёска, черты) строго как у человека на ${charCount>1?'первых '+charCount+' изображениях':'первом изображении'}.`;
  if(personaRef)p+=` Рядом ${pr.name} — внешность строго как у человека на последнем изображении.`;
  p+=`\nСцена: ${desc}`;
  return p;
}
async function makeBotPhoto(chatId,msg,signal){
  const chat=chatById(chatId);
  msg.status='pending';save('chats');chatChanged(chatId);
  try{
    const r=await photoRefs(chat,msg.together);
    const img=await callImage(imageApi(chat),photoPrompt(chat,msg.photoPrompt,r),r.refs,{signal});
    msg.mediaId=await storeMedia(b64ToBlob(img.data,img.mime));msg.mime=img.mime;msg.status='done';delete msg.error;
  }catch(e){
    if(e.name==='AbortError'){chat.messages=chat.messages.filter(x=>x!==msg);}
    else{msg.status='failed';msg.error=e.message;}
  }
  save('chats');chatChanged(chatId);
}
async function generate(chatId,opts={}){
  if(generating.has(chatId))return;
  const chat=chatById(chatId);if(!chat)return;
  const api=chatApi(chat);
  if(!api||!api.key||!api.model){toast('Сначала подключите API: Настройки → API подключения');return;}
  generating.add(chatId);
  const ctrl=new AbortController();aborters[chatId]=ctrl;const signal=ctrl.signal;
  chat.messages=chat.messages.filter(m=>m.role!=='error');
  chat.messages.forEach(m=>{if(m.role==='user')m.status='read';});
  setOnline(chat,true);
  try{
    const inline=await prepareMedia(chat,api,signal,k=>{busyLabel[chatId]={photo:'смотрит фото…',voice:'слушает голосовое…',circle:'смотрит кружочек…',video:'смотрит видео…'}[k]||'смотрит…';chatChanged(chatId);});
    delete busyLabel[chatId];chatChanged(chatId);
    const {system,turns,charName,mode}=buildPrompt(chat,Object.assign({},opts,{inline}));
    const raw=await callModel(api,system,turns,{signal});
    const parts=parseReply(raw,charName,mode);
    if(parts.ignore){
      chat.ignoredAt=Date.now();
      generating.delete(chatId);
      if(realistic(chat))setTimeout(()=>{if(!generating.has(chatId)){setOnline(chat,false);}},rnd(3,15)*1000);
      chatChanged(chatId);return;
    }
    if(!parts.length)throw new Error('Модель вернула пустой ответ. Попробуйте ещё раз.');
    for(let i=0;i<parts.length;i++){
      if(signal.aborted)break;
      const p=parts[i];
      if(i>0&&!p.photo)await sleep(Math.min(600+(p.text||'').length*38,3800));
      else await sleep(mode==='rp'?0:250);
      if(!chatById(chatId)||signal.aborted)break;
      if(p.photo){
        if((chat.photoFreq||'sometimes')==='never')continue;
        const msg={id:uid(),role:'bot',type:'photo',text:'',photoPrompt:p.photo,together:p.together,ts:Date.now(),status:'pending'};
        chat.messages.push(msg);busyLabel[chatId]='отправляет фото…';
        await makeBotPhoto(chatId,msg,signal);
        delete busyLabel[chatId];msg.ts=Date.now();
      }else chat.messages.push({id:uid(),role:'bot',text:p.text,ts:Date.now(),replyTo:p.quote?findQuoted(chat,p.quote):null});
      chat.botLastSeen=Date.now();
      save('chats');chatChanged(chatId);
    }
  }catch(e){
    if(e.name!=='AbortError'){chat.messages.push({id:uid(),role:'error',text:e.message,ts:Date.now()});save('chats');}
  }finally{
    delete aborters[chatId];delete busyLabel[chatId];
    if(generating.has(chatId)){
      generating.delete(chatId);
      if(realistic(chat)&&Math.random()<.15)setTimeout(()=>{if(!generating.has(chatId)&&!replyTimers[chatId])setOnline(chat,false);},rnd(20,60)*1000);
    }
    chatChanged(chatId);
    const last=chat.messages.filter(m=>m.role!=='error').pop();
    const hadErr=chat.messages.length&&chat.messages[chat.messages.length-1].role==='error';
    if(!signal.aborted&&last&&last.role==='user'&&last.status!=='read'&&!hadErr)scheduleReply(chatId);
    if(!signal.aborted)maybeSummarize(chatId);
  }
}
async function regenerateFrom(chatId,msgId){
  const chat=chatById(chatId);if(!chat||generating.has(chatId))return;
  chat.messages=chat.messages.filter(m=>m.role!=='error');
  let idx=msgId?chat.messages.findIndex(m=>m.id===msgId):-1;
  if(idx<0){idx=chat.messages.length;while(idx>0&&chat.messages[idx-1].role==='bot')idx--;}
  const anchor=idx>0?chat.messages[idx-1].id:null;
  const tail=chat.messages.slice(idx);
  const sw=chat.swipe&&chat.swipe.anchor===anchor?chat.swipe:{anchor,items:[],idx:0};
  if(tail.length){if(sw.items.length)sw.items[sw.idx]=tail;else sw.items.push(tail);}
  chat.swipe=sw;
  chat.messages=chat.messages.slice(0,idx);
  const prev=chat.messages[idx-1];
  save('chats');chatChanged(chatId);
  await generate(chatId,{first:!prev,cont:!!prev&&prev.role==='bot'});
  const ai=anchor?chat.messages.findIndex(m=>m.id===anchor):-1;
  const newTail=chat.messages.slice(ai+1).filter(m=>m.role==='bot');
  if(newTail.length&&chat.messages.slice(ai+1).every(m=>m.role==='bot')){sw.items.push(newTail);sw.idx=sw.items.length-1;}
  save('chats');chatChanged(chatId);
}
function swipeInfo(chat){
  const sw=chat.swipe;
  if(sw&&sw.items.length){
    const ai=sw.anchor?chat.messages.findIndex(m=>m.id===sw.anchor):-1;
    const tail=chat.messages.slice(ai+1);
    if((!sw.anchor||ai>=0)&&tail.length&&tail.every(m=>m.role==='bot'))return {sw,ai,lastId:tail[tail.length-1].id};
  }
  let ai=chat.messages.length-1;while(ai>=0&&chat.messages[ai].role==='bot')ai--;
  const tail=chat.messages.slice(ai+1);
  if(ai<0||chat.messages[ai].role!=='user'||!tail.length)return null;
  return {sw:{anchor:chat.messages[ai].id,items:[tail],idx:0},ai,lastId:tail[tail.length-1].id};
}
function swipeTo(chatId,dir){
  const chat=chatById(chatId);const info=swipeInfo(chat);if(!info||generating.has(chatId))return;
  const {sw,ai}=info;
  if(dir>0&&sw.idx>=sw.items.length-1){regenerateFrom(chatId,chat.messages[ai+1].id);return;}
  sw.items[sw.idx]=chat.messages.slice(ai+1);
  sw.idx=Math.max(0,Math.min(sw.items.length-1,sw.idx+dir));
  chat.messages=chat.messages.slice(0,ai+1).concat(JSON.parse(JSON.stringify(sw.items[sw.idx])));
  save('chats');chatChanged(chatId);
}

const summarizing=new Set();
function ltmApi(chat){const id=S.settings.ltm.apiId;return (id&&S.settings.apis.find(a=>a.id===id))||chatApi(chat);}
async function maybeSummarize(chatId,force=false){
  const chat=chatById(chatId);if(!chat||!chat.ltm||summarizing.has(chatId))return;
  if(!force&&(!chat.ltm.enabled||chat.ltm.auto===false))return;
  const fresh=chat.messages.filter(m=>(m.role==='user'||m.role==='bot')&&m.ts>(chat.ltm.upTo||0));
  if(!force&&fresh.length<(chat.ltm.every||30))return;
  if(!fresh.length){if(force)toast('Нет новых сообщений для памяти');return;}
  const api=ltmApi(chat);if(!api)return;
  const ch=charById(chat.characterId)||{name:'Персонаж'};const p=personaById(chat.personaId)||personaById(S.settings.activePersonaId);
  const un=p?p.name:'Собеседник';
  summarizing.add(chatId);chatChanged(chatId);
  try{
    const lines=fresh.map(m=>`${m.role==='user'?un:ch.name}: ${m.type&&m.type!=='text'?mediaTag(m):m.text}`).join('\n');
    let ask=(S.settings.ltm.prompt||DEFAULT_LTM_PROMPT)
      .replace(/\{\{char\}\}/gi,ch.name).replace(/\{\{user\}\}/gi,un)
      .replace(/\{\{format\}\}/gi,chatMode(chat)==='chat'?'переписки':'ролевой игры');
    const hasMem=/\{\{memory\}\}/i.test(ask),hasMsg=/\{\{messages\}\}/i.test(ask);
    ask=ask.replace(/\{\{memory\}\}/gi,chat.ltm.text||'(пусто)').replace(/\{\{messages\}\}/gi,lines);
    if(!hasMem)ask+=`\n\nТекущая память:\n${chat.ltm.text||'(пусто)'}`;
    if(!hasMsg)ask+=`\n\nНовые сообщения:\n${lines}`;
    const text=await callModel(api,'Ты ведёшь долгосрочную память ролевой переписки. Выводи только текст памяти.',[{role:'user',text:ask}]);
    chat.ltm.text=text.trim();chat.ltm.upTo=fresh[fresh.length-1].ts;
    save('chats');
    if(force)toast('Память обновлена');
  }catch(e){if(force)toast('Не удалось обновить память: '+e.message,5000);}
  finally{summarizing.delete(chatId);chatChanged(chatId);}
}

/* =====================================================
   Импорт PNG-карточек (Janitor / SillyTavern)
   ===================================================== */
function b64utf8(b64){const bin=atob(b64.replace(/\s/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
async function readCardPng(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const sig=[137,80,78,71,13,10,26,10];if(!sig.every((v,i)=>buf[i]===v))throw new Error('Это не PNG-файл');
  const dv=new DataView(buf.buffer);let off=8;const found={};const lat=new TextDecoder('latin1'),u8=new TextDecoder();
  while(off<buf.length){
    const len=dv.getUint32(off);const type=lat.decode(buf.slice(off+4,off+8));const data=buf.slice(off+8,off+8+len);
    if(type==='tEXt'){const z=data.indexOf(0);found[lat.decode(data.slice(0,z)).toLowerCase()]=lat.decode(data.slice(z+1));}
    else if(type==='iTXt'){const z=data.indexOf(0);const key=lat.decode(data.slice(0,z)).toLowerCase();
      let p=z+3;p=data.indexOf(0,p)+1;p=data.indexOf(0,p)+1;found[key]=u8.decode(data.slice(p));}
    if(type==='IEND')break;off+=12+len;
  }
  const raw=found.ccv3||found.chara;if(!raw)throw new Error('В картинке нет данных персонажа');
  let json;try{json=JSON.parse(b64utf8(raw));}catch{json=JSON.parse(raw);}
  const d=json.data||json;
  return d;
}
async function importCard(){
  const [f]=await pickFiles('image/png,.png');if(!f)return null;
  try{
    const d=await readCardPng(f);
    const parts=[];
    if(d.description)parts.push(d.description.trim());
    if(d.personality&&d.personality.trim())parts.push('Личность: '+d.personality.trim());
    if(d.scenario&&d.scenario.trim())parts.push('Сценарий: '+d.scenario.trim());
    const greetings=[d.first_mes,...(d.alternate_greetings||[])].filter(g=>g&&g.trim()).map(g=>g.trim());
    const photo=await resizeImage(f,1280);
    const c={id:uid(),name:(d.name||'Без имени').trim(),personality:parts.join('\n\n'),photos:[{src:photo,ref:true}],
      cardGreetings:greetings,cardBook:d.character_book||null,createdAt:Date.now()};
    S.characters.push(c);await save('characters');
    toast('Персонаж «'+c.name+'» добавлен'+(greetings.length?' · первых сообщений: '+greetings.length:''),3500);
    return c;
  }catch(e){toast('Не удалось прочитать карточку: '+e.message,5000);return null;}
}

}

// содержимое медиа-сообщения
function mediaInner(m){
  if(m.type==='photo'){
    if(m.status==='pending')return `<div class="mph"><span class="spin"></span><span>фото загружается…</span></div>`;
    if(m.status==='failed')return `<div class="mph failed"><span>⚠️ Фото не получилось</span><small>${esc((m.error||'').slice(0,160))}</small><button data-rephoto="${m.id}">Повторить</button></div>`;
    return `<img class="mimg" data-media="${m.mediaId}" data-photo="${m.id}" alt="">`;
  }
  if(m.type==='video')return `<video class="mvid" data-media="${m.mediaId}" data-vid playsinline preload="metadata" muted></video><span class="vbadge">▶ ${fmtDur(m.duration)}</span>`;
  if(m.type==='voice'){
    const bars=(m.wave||[]).map((h,i)=>`<i style="height:${Math.round(4+h*20)}px"></i>`).join('');
    return `<div class="voice" data-voice="${m.mediaId}"><button class="vplay">▶</button><div class="wave">${bars}</div><span class="vdur">${fmtDur(m.duration)}</span></div>`;
  }
  if(m.type==='file')return `<div class="fileb" data-file="${m.id}"><div class="ficon">${(m.name||'').split('.').pop().slice(0,4).toUpperCase()||'FILE'}</div><div class="finfo"><b>${esc(m.name||'файл')}</b><small>${fmtSize(m.size||0)}</small></div></div>`;
  return '';
}
let playingAudio=null;
function playVoice(el,url){
  const a=el._audio||(el._audio=new Audio(url));
  const btn=$('.vplay',el);const bars=$$('.wave i',el);
  if(playingAudio&&playingAudio!==a){playingAudio.pause();}
  if(a.paused){a.play();playingAudio=a;btn.textContent='❚❚';}else{a.pause();btn.textContent='▶';}
  a.ontimeupdate=()=>{const p=a.duration?a.currentTime/a.duration:0;bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<p));};
  a.onended=()=>{btn.textContent='▶';bars.forEach(b=>b.classList.remove('on'));};
  a.onpause=()=>{btn.textContent='▶';};
}
function videoViewer(url){
  const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<video src="${url}" controls autoplay playsinline style="max-width:100%;max-height:100%"></video><div class="vtop"><button class="glass" data-vx>Закрыть</button></div>`;
  const close=()=>{v.classList.remove('show');setTimeout(()=>v.remove(),200);};
  $('[data-vx]',v).onclick=close;app.appendChild(v);requestAnimationFrame(()=>v.classList.add('show'));
}
async function openPhoto(chat,msgId){
  const list=chat.messages.filter(m=>m.type==='photo'&&m.mediaId&&m.status!=='pending'&&m.status!=='failed');
  const urls=await Promise.all(list.map(m=>mediaUrl(m.mediaId)));
  viewer(urls.filter(Boolean),Math.max(0,list.findIndex(m=>m.id===msgId)));
}
async function saveMedia(m){
  const url=await mediaUrl(m.mediaId);if(!url)return;
  const blob=await DB.getMedia(m.mediaId);
  const ext=(blob.type.split('/')[1]||'bin').split(';')[0];
  const file=new File([blob],m.name||('veya-'+m.id+'.'+ext),{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(e){if(e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}
function hydrateMedia(root,chat){
  $$('[data-media]',root).forEach(async n=>{const url=await mediaUrl(n.dataset.media);if(!url)return;
    if(n.tagName==='VIDEO')n.src=url+'#t=0.1';else n.src=url;});
  $$('[data-photo]',root).forEach(n=>n.onclick=e=>{e.stopPropagation();openPhoto(chat,n.dataset.photo);});
  $$('[data-vid]',root).forEach(n=>n.parentElement.onclick=async e=>{e.stopPropagation();videoViewer(await mediaUrl(n.dataset.media));});
  $$('[data-voice]',root).forEach(n=>{$('.vplay',n).onclick=async e=>{e.stopPropagation();playVoice(n,await mediaUrl(n.dataset.voice));};});
  $$('[data-file]',root).forEach(n=>n.onclick=e=>{e.stopPropagation();const m=chat.messages.find(x=>x.id===n.dataset.file);if(m)saveMedia(m);});
  $$('[data-rephoto]',root).forEach(n=>n.onclick=e=>{e.stopPropagation();const m=chat.messages.find(x=>x.id===n.dataset.rephoto);if(!m)return;
    const ctrl=new AbortController();busyLabel[chat.id]='отправляет фото…';makeBotPhoto(chat.id,m,ctrl.signal).then(()=>{delete busyLabel[chat.id];chatChanged(chat.id);});});
  $$('.circle',root).forEach(c=>{const v=$('video',c);c.onclick=()=>{
    if(v.paused){$$('.circle video').forEach(o=>{if(o!==v&&!o.paused)o.pause();});v.muted=false;v.currentTime=v.currentTime<0.2?0:v.currentTime;v.play();c.classList.add('playing');}
    else{v.pause();c.classList.remove('playing');}};
    v.onended=()=>{c.classList.remove('playing');v.currentTime=0;};});
}

/* ---------- запись голосовых и кружочков ---------- */
let recorder=null;
function pickMime(kind){
  const opts=kind==='audio'?['audio/mp4','audio/webm;codecs=opus','audio/webm']:['video/mp4','video/webm;codecs=vp8,opus','video/webm'];
  return opts.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
}
async function startRecording(chatId,type,ui){
  if(!window.MediaRecorder||!navigator.mediaDevices){toast('Запись не поддерживается в этом браузере');return;}
  let stream;
  const constraints=type==='voice'?{audio:true}:{audio:true,video:{facingMode:ui.facing||'user',width:{ideal:480},height:{ideal:480}}};
  try{stream=await navigator.mediaDevices.getUserMedia(constraints);}
  catch(e){toast('Нет доступа к '+(type==='voice'?'микрофону':'камере')+'. Разрешите его в настройках iPhone → Safari.',5000);return;}
  const mime=pickMime(type==='voice'?'audio':'video');
  const mr=new MediaRecorder(stream,Object.assign(mime?{mimeType:mime}:{},type==='circle'?{videoBitsPerSecond:900000,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000}));
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const rec={chatId,type,mr,stream,chunks,start:Date.now(),mime:mr.mimeType||mime,ui};
  recorder=rec;
  mr.start(250);
  rec.timer=setInterval(()=>{const s=(Date.now()-rec.start)/1000;ui.tick(s);if(s>=(type==='circle'?60:300))finishRecording(true);},200);
  ui.started(stream);
}
async function finishRecording(send){
  const rec=recorder;if(!rec)return;recorder=null;
  clearInterval(rec.timer);
  const stopped=new Promise(r=>rec.mr.onstop=r);
  try{rec.mr.stop();}catch{}
  await stopped;rec.stream.getTracks().forEach(t=>t.stop());
  rec.ui.ended();
  if(!send)return;
  const dur=(Date.now()-rec.start)/1000;
  if(dur<0.8){toast('Слишком коротко');return;}
  const blob=new Blob(rec.chunks,{type:(rec.mime||'').split(';')[0]||(rec.type==='voice'?'audio/mp4':'video/mp4')});
  const chat=chatById(rec.chatId);if(!chat)return;
  const mediaId=await storeMedia(blob);
  const msg={id:uid(),role:'user',type:rec.type,mediaId,mime:blob.type,ts:Date.now(),status:'sent',text:'',duration:dur};
  if(rec.type==='voice'){const info=await audioInfo(blob);msg.wave=info.wave;if(info.duration)msg.duration=info.duration;}
  sendUserMessage(chat,msg);
}
function sendUserMessage(chat,msg){
  chat.messages=chat.messages.filter(m=>m.role!=='error');
  chat.swipe=null;
  chat.messages.push(msg);
  save('chats');chatChanged(chat.id);
  if(!generating.has(chat.id))scheduleReply(chat.id);
}
function circleOverlay(chatId){
  const o=document.createElement('div');o.className='circrec';
  o.innerHTML=`<div class="cr-circle"><video autoplay playsinline muted></video></div>
    <div class="cr-tools"><button class="glass" data-flip>⟲</button></div>
    <div class="cr-bottom glass"><span class="dot"></span><span class="rt">0:00</span><button data-cancel>Отмена</button></div>
    <button class="cr-send" data-send>${IC.send}</button>`;
  app.appendChild(o);requestAnimationFrame(()=>o.classList.add('show'));
  const v=$('video',o);let facing='user';
  const ui={facing,tick:s=>$('.rt',o).textContent=fmtDur(s),started:st=>{v.srcObject=st;v.style.transform=facing==='user'?'scaleX(-1)':'';},
    ended:()=>{v.srcObject=null;}};
  const close=()=>{o.classList.remove('show');setTimeout(()=>o.remove(),250);};
  $('[data-cancel]',o).onclick=async()=>{await finishRecording(false);close();};
  $('[data-send]',o).onclick=async()=>{close();await finishRecording(true);};
  $('[data-flip]',o).onclick=async()=>{await finishRecording(false);facing=facing==='user'?'environment':'user';ui.facing=facing;startRecording(chatId,'circle',ui);toast('Камера переключена — запись началась заново',2000);};
  ui.endedClose=close;
  startRecording(chatId,'circle',ui).then(()=>{if(!recorder)close();});
}

function chatScreen(el,chatId){
  const chat=chatById(chatId);if(!chat){el.innerHTML='';return;}
  el.chatId=chatId;el.classList.add('chat');
  let replyTo=null;
  const med=S.settings.media;
  let recMode=med.voice?'voice':'circle';
  el.innerHTML=`<div class="wall"></div>
   <div class="chathead">
     <button class="hback glass" data-back>${IC.back}</button>
     <button class="hmid glass" data-prof><div class="hname"></div><div class="hstatus"></div></button>
     <button class="havatar" data-prof></button>
   </div>
   <div class="msgs"></div>
   <div class="stoppill"><button class="glass" data-stop>■ Остановить</button></div>
   <div class="replybar glass" style="display:none"><div class="rb-body"><b></b><span></span></div><button data-rbx>×</button></div>
   <div class="composer">
     <button class="cbtn glass" data-attach>${IC.clip}</button>
     <div class="inputwrap glass"><textarea rows="1" placeholder="Сообщение"></textarea></div>
     <button class="cbtn glass" data-act>${IC.mic}</button>
   </div>
   <div class="recbar" style="display:none"><div class="glass rb-in"><span class="dot"></span><span class="rt">0:00</span><button data-rcancel>Отмена</button></div><button class="cbtn send" data-rsend>${IC.send}</button></div>`;
  bindBack(el);
  $$('[data-prof]',el).forEach(b=>b.onclick=()=>push(e=>botProfile(e,chatId)));
  const ta=$('textarea',el),act=$('[data-act]',el),msgsEl=$('.msgs',el),rb=$('.replybar',el),comp=$('.composer',el),recbar=$('.recbar',el);
  const canRec=()=>med.voice||med.video;
  const syncBtn=()=>{const has=ta.value.trim().length>0;
    act.innerHTML=has?IC.send:(recMode==='voice'?IC.mic:IC.cam);
    act.classList.toggle('send',has);act.classList.toggle('glass',!has);
    act.style.visibility=has||canRec()?'':'hidden';};
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';};
  composers[chatId]=ta;
  ta.oninput=()=>{grow();syncBtn();if(replyTimers[chatId])scheduleReply(chatId);};
  ta.onfocus=()=>{setTimeout(()=>scrollBottom(),300);if(replyTimers[chatId])scheduleReply(chatId);};
  ta.onblur=()=>{if(replyTimers[chatId])scheduleReply(chatId);};
  const setReply=(m)=>{replyTo=m?m.id:null;rb.style.display=m?'':'none';
    if(m){const ch=charById(chat.characterId)||{name:''};const p=personaById(chat.personaId);
      $('b',rb).textContent='Ответ '+(m.role==='bot'?ch.name:(p?p.name:'себе'));$('span',rb).textContent=msgPreview(m).slice(0,80);ta.focus();}};
  $('[data-rbx]',rb).onclick=()=>setReply(null);
  $('[data-stop]',el).onclick=()=>{stopGeneration(chatId);toast('Ответ остановлен');};

  // вложения
  $('[data-attach]',el).onclick=()=>{
    const acts=[];
    if(med.photo||med.video)acts.push({label:med.photo&&med.video?'Фото или видео':med.photo?'Фото':'Видео',onClick:()=>attachGallery()});
    acts.push({label:'Файл (txt, docx, pdf, json…)',onClick:()=>attachFile()});
    sheet({actions:acts});
  };
  async function attachGallery(){
    const accept=[med.photo&&'image/*',med.video&&'video/*'].filter(Boolean).join(',');
    const files=await pickFiles(accept,true);if(!files.length)return;
    let caption=ta.value.trim();
    for(const f of files){
      try{
        let msg;
        if(f.type.startsWith('image/')){
          const blob=dataUrlToBlob(await resizeImage(f,1600));
          msg={id:uid(),role:'user',type:'photo',mediaId:await storeMedia(blob),mime:blob.type,status:'sent'};
        }else{
          if(f.size>50*1048576){toast('Видео больше 50 МБ — слишком тяжёлое',4000);continue;}
          const info=await videoInfo(f);
          msg={id:uid(),role:'user',type:'video',mediaId:await storeMedia(f),mime:f.type,duration:info.duration,status:'sent'};
          if(f.size>15*1048576)toast('Большое видео: модель может его не принять. Лучше до 15 МБ.',4500);
        }
        msg.ts=Date.now();msg.text=caption;caption='';msg.replyTo=replyTo;
        sendUserMessage(chat,msg);
      }catch(e){toast('Не удалось добавить: '+e.message,4000);}
    }
    ta.value='';grow();syncBtn();setReply(null);renderMsgs(true);
  }
  async function attachFile(){
    const [f]=await pickFiles('.txt,.md,.json,.csv,.pdf,.docx,.log,.xml,.html,text/*,application/json,application/pdf');if(!f)return;
    try{
      let fileText=null;
      try{fileText=await readFileText(f);}catch(e){toast('Текст из файла не прочитался: '+e.message,4000);}
      const msg={id:uid(),role:'user',type:'file',mediaId:await storeMedia(f),mime:f.type||'application/octet-stream',name:f.name,size:f.size,fileText,ts:Date.now(),status:'sent',text:ta.value.trim(),replyTo};
      ta.value='';grow();syncBtn();setReply(null);

  }

  // кнопка справа: отправить / тап — переключить голосовое↔кружок / удержать — записать
  let holdT=null,held=false,hintShown=false;
  act.addEventListener('pointerdown',e=>{
    if(ta.value.trim()||!canRec())return;
    held=false;holdT=setTimeout(()=>{held=true;if(navigator.vibrate)navigator.vibrate(15);beginRecord();},320);
  });
  const cancelHold=()=>{clearTimeout(holdT);holdT=null;};
  act.addEventListener('pointerleave',cancelHold);act.addEventListener('pointercancel',cancelHold);
  act.addEventListener('pointerup',()=>{
    if(ta.value.trim())return;
    if(holdT){cancelHold();
      if(med.voice&&med.video){recMode=recMode==='voice'?'circle':'voice';syncBtn();}
      if(!hintShown){hintShown=true;toast('Удерживайте кнопку, чтобы записать '+(recMode==='voice'?'голосовое':'кружочек')+'. Короткое нажатие — переключить.',3500);}

  act.onclick=()=>{

  function beginRecord(){

  el.onLeave=()=>{document.removeEventListener('veya:resize',onResize);if(composers[chatId]===ta)delete composers[chatId];if(recorder&&recorder.chatId===chatId)finishRecording(false);if(playingAudio)playingAudio.pause();};

    const typing=generating.has(chatId);
    const rp=chatMode(chat)==='rp';
    el.classList.toggle('rp',rp);
    const st=$('.hstatus',el);
    st.style.display=rp?'none':'';
    const on=typing||isOnline(chat);
    st.textContent=typing?(busyLabel[chatId]||'печатает…'):on?'в сети':lastSeenText(chat.botLastSeen);
    st.classList.toggle('on',on);
    $('.havatar',el).innerHTML=avatar(charPhoto(ch),ch.name,46);
    $('.stoppill',el).classList.toggle('show',typing);
  }
  function swipeHTML(){
    const info=swipeInfo(chat);if(!info||generating.has(chatId))return '';
    return `<div class="swipes"><button data-sw="-1" ${info.sw.idx===0?'disabled':''}>‹</button><span>${info.sw.idx+1} / ${info.sw.items.length}</span><button data-sw="1">›</button></div>`;
  }
  function renderMsgs(forceBottom){
    const nearBottom=msgsEl.scrollHeight-msgsEl.scrollTop-msgsEl.clientHeight<160;
    const list=chat.messages;let html='<div class="spacer-top"></div>';let prevDay=null;
    const info=swipeInfo(chat);
    if(chatMode(chat)==='rp'){
      const ch=charById(chat.characterId)||{name:'Персонаж'};const pr=personaById(chat.personaId)||personaById(S.settings.activePersonaId);
      list.forEach(m=>{
        if(m.role==='error'){html+=`<div class="errrow" data-retry>⚠️ ${esc(m.text)}<b>Нажмите, чтобы повторить</b></div>`;return;}
        const media=m.type&&m.type!=='text'?(m.type==='circle'?`<div class="circle inrp"><video data-media="${m.mediaId}" playsinline preload="metadata"></video><span class="cdur">${fmtDur(m.duration)}</span></div>`:`<div class="rpmedia">${mediaInner(m)}</div>`):'';
        html+=`<div class="rpcard ${m.role}" data-m="${m.id}"><div class="who">${esc(m.role==='user'?(pr?pr.name:'Вы'):ch.name)}</div>${media}${m.text?`<div class="md">${md(m.text)}</div>`:''}${info&&info.lastId===m.id?swipeHTML():''}</div>`;
      });
      if(generating.has(chatId))html+='<div class="typingdots"><i></i><i></i><i></i></div>';
    }else{
      list.forEach((m,i)=>{
        const dk=dayKey(m.ts);if(dk!==prevDay){html+=`<div class="dsep">${fmtDay(m.ts)}</div>`;prevDay=dk;}
        if(m.role==='error'){html+=`<div class="errrow" data-retry>⚠️ ${esc(m.text)}<b>Нажмите, чтобы повторить</b></div>`;return;}
        const prev=list[i-1],next=list[i+1];
        const gap=!prev||prev.role!==m.role||dayKey(prev.ts)!==dk;
        const tail=!next||next.role!==m.role||dayKey(next.ts)!==dk||next.ts-m.ts>5*6e4;
        const ticks=m.role==='user'?(m.status==='read'?IC.tick2:IC.tick1):'';
        const meta=`<span class="meta">${m.edited?'изменено ':''}${fmtTime(m.ts)}${ticks}</span>`;
        if(m.type==='circle'){
          html+=`<div class="mrow ${m.role} ${gap?'gap':''}"><div class="circle" data-m="${m.id}"><video data-media="${m.mediaId}" playsinline preload="metadata"></video><span class="cdur">${fmtDur(m.duration)}</span>${meta}</div></div>`;
        }else if(m.type&&m.type!=='text'){
          const visual=m.type==='photo'||m.type==='video';
          html+=`<div class="mrow ${m.role} ${tail?'tail':''} ${gap?'gap':''}"><div class="bubble media ${visual?'visual':''} ${visual&&!m.text?'nocap':''}" data-m="${m.id}">${quoteHTML(chat,m)}${mediaInner(m)}${m.text?`<div class="cap"><span class="md">${md(m.text)}</span><span class="sp"></span></div>`:(visual?'':'<span class="sp"></span>')}${meta}</div></div>`;
        }else{
          html+=`<div class="mrow ${m.role} ${tail?'tail':''} ${gap?'gap':''}"><div class="bubble" data-m="${m.id}">${quoteHTML(chat,m)}<span class="md">${md(m.text)}</span><span class="sp ${m.edited?'edited-sp':''}"></span>${meta}</div></div>`;
        }
        if(info&&info.lastId===m.id)html+=swipeHTML();
      });
    }
    msgsEl.innerHTML=html;
    if(forceBottom||nearBottom)scrollBottom();
    $$('img,video',msgsEl).forEach(n=>n.addEventListener(n.tagName==='IMG'?'load':'loadedmetadata',()=>{if(forceBottom||nearBottom)scrollBottom();},{once:true}));
    hydrateMedia(msgsEl,chat);
    $$('[data-retry]',msgsEl).forEach(b=>b.onclick=()=>{chat.messages=chat.messages.filter(m=>m.role!=='error');save('chats');
      const last=chat.messages[chat.messages.length-1];generate(chatId,{first:!last});});
    $$('[data-sw]',msgsEl).forEach(b=>b.onclick=e=>{e.stopPropagation();swipeTo(chatId,+b.dataset.sw);});
    $$('[data-goto]',msgsEl).forEach(b=>b.onclick=e=>{e.stopPropagation();const t=$(`[data-m="${b.dataset.goto}"]`,msgsEl);
      if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1200);}});
    bindLongPress();
  }
  function openMenu(mid){
    if(navigator.vibrate)navigator.vibrate(10);
    if(isEditing()){document.activeElement.blur();setTimeout(()=>msgMenu(mid),380);}else msgMenu(mid);
  }
  function bindLongPress(){
    $$('.bubble,.rpcard,.circle[data-m]',msgsEl).forEach(b=>{
      let t=null,sx=0,sy=0;
      b.addEventListener('touchstart',e=>{if(e.target.closest('[data-sw],[data-goto],.vplay,[data-rephoto]'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;b.classList.add('pressed');t=setTimeout(()=>{t=null;b.classList.remove('pressed');b._lp=Date.now();openMenu(b.dataset.m);},450);},{passive:true});
      const cancel=()=>{clearTimeout(t);t=null;b.classList.remove('pressed');};
      b.addEventListener('touchmove',e=>{const x=e.touches[0];if(Math.abs(x.clientX-sx)>8||Math.abs(x.clientY-sy)>8)cancel();},{passive:true});
      b.addEventListener('touchend',cancel);b.addEventListener('touchcancel',cancel);
      b.addEventListener('click',e=>{if(b._lp&&Date.now()-b._lp<700){e.stopPropagation();e.preventDefault();}},true);
      b.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(b.dataset.m);});
    });
  }
  function msgMenu(mid){
    const m=chat.messages.find(x=>x.id===mid);if(!m)return;
    const i=chat.messages.indexOf(m);
    const inLastBatch=m.role==='bot'&&chat.messages.slice(i+1).every(x=>x.role!=='user');
    const firstOfBatch=inLastBatch&&(i===0||chat.messages[i-1].role!=='bot');
    const isMedia=m.type&&m.type!=='text';
    const acts=[];
    if(chatMode(chat)==='chat')acts.push({label:'Ответить',onClick:()=>setReply(m)});
    if(m.text)acts.push({label:'Копировать',onClick:()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('Скопировано'));}});
    if(!isMedia||m.text||m.type==='photo'||m.type==='video'||m.type==='file')acts.push({label:isMedia?'Изменить подпись':'Изменить',onClick:async()=>{const v=await editText(isMedia?'Подпись':'Изменить сообщение',m.text||'');if(v===null)return;if(!isMedia&&!v.trim())return;m.text=v.trim();m.edited=true;save('chats');renderMsgs();}});
    if(m.mediaId)acts.push({label:'Сохранить на телефон',onClick:()=>saveMedia(m)});
    if(m.desc)acts.push({label:'Что увидела/услышала модель',onClick:async()=>{const v=await editText('Расшифровка для модели',m.desc);if(v!==null){m.desc=v.trim()||undefined;save('chats');}}});
    if(inLastBatch&&!generating.has(chatId))acts.push({label:firstOfBatch?'Перегенерировать ответ':'Перегенерировать с этого сообщения',onClick:()=>regenerateFrom(chatId,mid)});
    acts.push({label:'Удалить',danger:true,onClick:()=>{chat.messages=chat.messages.filter(x=>x.id!==mid);deleteMediaOf([m]);save('chats');renderMsgs();}});
    sheet({actions:acts});
  }
  el.refresh=()=>{chat.lastOpened=Date.now();renderHead();renderMsgs();};
  chat.lastOpened=Date.now();save('chats');
  onChatOpened(chat);
  renderHead();renderMsgs(true);syncBtn();
  const last=chat.messages[chat.messages.length-1];
  if(last&&last.role==='user'&&last.status!=='read'&&!generating.has(chatId)&&!replyTimers[chatId])scheduleReply(chatId);
  const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return;}presenceTick(chat);renderHead();},60000);
}

   ЭКРАН: профиль бота в чате = настройки этого чата

const TZ_LIST=(()=>{try{return Intl.supportedValuesOf('timeZone');}catch{return ['Europe/Moscow','Europe/Kaliningrad','Europe/Samara','Asia/Yekaterinburg','Asia/Omsk','Asia/Novosibirsk','Asia/Krasnoyarsk','Asia/Irkutsk','Asia/Yakutsk','Asia/Vladivostok','Asia/Magadan','Asia/Kamchatka','Europe/Kiev','Europe/Minsk','Europe/London','Europe/Berlin','Europe/Paris','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Asia/Tokyo','Asia/Seoul','Asia/Shanghai','Australia/Sydney'];}})();
function botProfile(el,chatId){
  const chat=chatById(chatId);el.chatId=chatId;
  let idx=0,expanded=false,tab='media';
  const draw=()=>{
    const ch=charById(chat.characterId);if(!ch){pop();return;}

    const persona=personaById(chat.personaId);
    const rp=chatMode(chat)==='rp';
    const typing=generating.has(chatId);const on=typing||isOnline(chat);
    const status=rp?'':typing?(busyLabel[chatId]||'печатает…'):on?'в сети':lastSeenText(chat.botLastSeen);
    const ltm=chat.ltm||(chat.ltm={enabled:true,auto:true,every:30,text:'',upTo:0});
    const auto=ltm.auto!==false;
    const mediaMsgs=chat.messages.filter(m=>(m.type==='photo'&&m.status!=='pending'&&m.status!=='failed'||m.type==='video')&&m.mediaId).reverse();
    const fileMsgs=chat.messages.filter(m=>['voice','circle','file'].includes(m.type)).reverse();
    let pane='';
    if(tab==='media')pane=mediaMsgs.length?`<div class="mgrid">${mediaMsgs.map(m=>m.type==='photo'?`<img data-media="${m.mediaId}" data-photo="${m.id}">`:`<div class="mgv"><video data-media="${m.mediaId}" data-vid playsinline preload="metadata" muted></video><span>▶ ${fmtDur(m.duration)}</span></div>`).join('')}</div>`:'<div class="tabpane">Фото и видео из чата появятся здесь</div>';
    else if(tab==='files')pane=fileMsgs.length?`<div class="group">${fileMsgs.map(m=>m.type==='file'
        ?`<button class="row" data-file="${m.id}"><span class="ficon sm">${(m.name||'').split('.').pop().slice(0,4).toUpperCase()}</span><span class="label" style="font-size:15px">${esc(m.name)}<br><small style="color:var(--text2)">${fmtSize(m.size||0)} · ${fmtDay(m.ts)}</small></span></button>`
        :m.type==='voice'?`<div class="row"><div class="voice" data-voice="${m.mediaId}" style="flex:1"><button class="vplay">▶</button><div class="wave">${(m.wave||[]).map(h=>`<i style="height:${Math.round(4+h*16)}px"></i>`).join('')}</div><span class="vdur">${fmtDur(m.duration)}</span></div><small style="color:var(--text2)">${m.role==='user'?'вы':esc(ch.name)} · ${fmtDay(m.ts)}</small></div>`
        :`<button class="row" data-circ="${m.mediaId}"><span class="ficon sm round">⭕</span><span class="label" style="font-size:15px">Кружочек · ${fmtDur(m.duration)}<br><small style="color:var(--text2)">${fmtDay(m.ts)}, ${fmtTime(m.ts)}</small></span></button>`).join('')}</div>`:'<div class="tabpane">Голосовые, кружочки и файлы из чата появятся здесь</div>';
    else pane='<div class="tabpane">Лорбуки появятся на этапе 4</div>';
    el.innerHTML=`<div class="scroll" style="padding-bottom:30px">
      <div class="phero">
        ${photos.length?`<img src="${photos[idx].src}">`:`<div class="noimg">${esc((ch.name||'?').charAt(0).toUpperCase())}</div>`}
        <div class="shade"></div>
        <div class="tapc" style="position:absolute;inset:0"></div>
        ${photos.length>1?`<div class="bars">${photos.map((p,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div><div class="tapl" style="width:28%"></div><div class="tapr" style="width:28%"></div>`:''}
        <div class="pname"><h2>${esc(ch.name)}</h2><div class="${on?'on':''}">${status}</div></div>
      </div>
      <button class="overbtn l glass" data-back style="width:44px">${IC.back}</button>
      <div class="actions">
        <button data-a="chat">${IC.chat}чат</button>
        <button data-a="mute">${chat.muted?IC.bellOff:IC.bell}${chat.muted?'вкл. звук':'звук'}</button>
        <button data-a="more">${IC.dots}ещё</button>
      </div>
      <div class="card"><div class="k">описание</div><div class="v ${expanded?'':'clamp'}">${esc(ch.personality||'Описание не заполнено')}</div>
        ${(ch.personality||'').length>280?`<button class="more" data-exp>${expanded?'свернуть':'ещё'}</button>`:''}</div>
      <div class="group-foot">Контакт можно изменить во вкладке «Контакты».</div>

      <div class="group-title">Настройки этого чата</div>
      <div class="group">
        <div class="row"><span class="label">Формат</span><span class="value">${rp?'Ролплей':'Переписка (смс)'}</span></div>
        <button class="row" data-capi><span class="label">Модель</span><span class="value">${esc(apiOptionLabel(chat.apiId))}</span>${IC.chev}</button>
        <button class="row" data-ed="relation"><span class="label">${rp?'Сценарий':'Кто вы друг другу'}</span><span class="value">${esc(chat.relation?plain(chat.relation).slice(0,30):'не указано')}</span>${IC.chev}</button>
        <button class="row" data-ed="style"><span class="label">Стиль письма</span><span class="value">${esc(chat.style?plain(chat.style).slice(0,30):'по характеру')}</span>${IC.chev}</button>
        ${rp?'':`<button class="row" data-pf><span class="label">Фото от бота</span><span class="value">${PHOTO_FREQ[chat.photoFreq||'sometimes']}</span>${IC.chev}</button>
        <div class="row"><span class="label">Часовой пояс</span><div class="selectwrap" style="max-width:55%"><select data-tz style="background:transparent;border:0;color:var(--text2);text-align:right;padding-right:16px;max-width:100%">
          <option value="">Как на телефоне</option>${TZ_LIST.map(z=>`<option ${chat.tz===z?'selected':''}>${z}</option>`).join('')}</select></div></div>
        <button class="row" data-real><span class="label">Живое поведение</span><span class="toggle ${chat.realism!==false?'on':''}"></span></button>`}
        <div class="row"><span class="label">Вы пишете как</span><span class="value">${esc(persona?persona.name:'—')}</span></div>
      </div>
      <div class="group-foot">Формат чата нельзя изменить после начала.${rp?'':' «Живое поведение»: бот бывает не в сети, читает не сразу, иногда заходит и ничего не пишет, может проигнорировать.'}</div>

      <div class="group-title">Долгая память</div>
      <div class="group">
        <button class="row" data-ltm><span class="label">Использовать</span><span class="toggle ${ltm.enabled?'on':''}"></span></button>
        <button class="row" data-auto><span class="label">Автообновление</span><span class="toggle ${auto?'on':''}"></span></button>
        ${auto?`<div class="row"><span class="label">Каждые</span><input data-every type="number" inputmode="numeric" min="5" max="500" value="${ltm.every||30}" class="numbox"><span class="value" style="margin-left:6px">сообщ.</span></div>`:''}
        <button class="row" data-ed="ltm"><span class="label">Что бот помнит</span><span class="value">${ltm.text?'открыть':'пока пусто'}</span>${IC.chev}</button>
        <button class="row" data-ltmnow><span class="label" style="color:var(--accent)">${summarizing.has(chatId)?'Обновляю…':'Обновить память сейчас'}</span></button>
      </div>
      <div class="group-foot">${auto?'Бот сам переписывает выжимку важного из переписки.':'Автообновление выключено: память меняется только вручную — впишите её сами или нажмите «Обновить сейчас».'} Промпт и модель для памяти — в общих Настройках.</div>

      <div class="tabs"><button data-t="media" class="${tab==='media'?'on':''}">Медиа</button><button data-t="files" class="${tab==='files'?'on':''}">Файлы</button><button data-t="lore" class="${tab==='lore'?'on':''}">Лорбуки</button></div>
      ${pane}
    </div>`;
    bindBack(el);
    hydrateMedia(el,chat);
    $$('[data-circ]',el).forEach(b=>b.onclick=async()=>videoViewer(await mediaUrl(b.dataset.circ)));
    const tl=$('.tapl',el),tr=$('.tapr',el);
    if(tl)tl.onclick=()=>{idx=(idx-1+photos.length)%photos.length;draw();};
    if(tr)tr.onclick=()=>{idx=(idx+1)%photos.length;draw();};
    $('.tapc',el).onclick=()=>viewer(photos.map(p=>p.src),idx);
    const ex=$('[data-exp]',el);if(ex)ex.onclick=()=>{expanded=!expanded;draw();};
    $('[data-capi]',el).onclick=async()=>{const r=await pickApiSheet(chat.apiId);if(r){chat.apiId=r.id;save('chats');draw();}};
    const pf=$('[data-pf]',el);if(pf)pf.onclick=()=>sheet({title:'Как часто бот присылает свои фото',actions:Object.entries(PHOTO_FREQ).map(([k,l])=>({label:((chat.photoFreq||'sometimes')===k?'✓ ':'')+l,onClick:()=>{chat.photoFreq=k;save('chats');draw();}}))});
    const titles={relation:rp?'Сценарий / предыстория':'Кто вы друг другу',style:'Как пишет '+ch.name,ltm:'Долгая память'};
    $$('[data-ed]',el).forEach(b=>b.onclick=async()=>{
      const k=b.dataset.ed;const cur=k==='ltm'?ltm.text:chat[k];
      if(k==='style'&&!cur)toast('Например: пишет только маленькими буквами, без точек, много мата и опечаток',4500);
      const v=await editText(titles[k],cur||'');if(v===null)return;
      if(k==='ltm')ltm.text=v.trim();else chat[k]=v.trim();
      save('chats');draw();});
    const tz=$('[data-tz]',el);if(tz)tz.onchange=()=>{chat.tz=tz.value||null;save('chats');};
    const real=$('[data-real]',el);if(real)real.onclick=()=>{chat.realism=chat.realism===false;if(chat.realism===false)setOnline(chat,true);save('chats');draw();};
    $('[data-ltm]',el).onclick=()=>{ltm.enabled=!ltm.enabled;save('chats');draw();};
    $('[data-auto]',el).onclick=()=>{ltm.auto=!auto;save('chats');draw();};
    const ev=$('[data-every]',el);if(ev)ev.onchange=()=>{let v=Math.round(+ev.value||30);v=Math.max(5,Math.min(500,v));ltm.every=v;save('chats');draw();};
    $('[data-ltmnow]',el).onclick=()=>{if(!summarizing.has(chatId))maybeSummarize(chatId,true);};
    $$('[data-t]',el).forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
    $$('[data-a]',el).forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='chat')pop();
      if(a==='mute'){chat.muted=!chat.muted;save('chats');draw();toast(chat.muted?'Уведомления от этого чата выключены':'Уведомления включены');}
      if(a==='more')sheet({actions:[
        {label:'Очистить историю',danger:true,onClick:async()=>{if(await confirmSheet('Удалить все сообщения в этом чате? Долгая память тоже очистится.','Очистить')){deleteMediaOf(chat.messages);chat.messages=[];chat.swipe=null;ltm.text='';ltm.upTo=0;save('chats');toast('История очищена');}}},
        {label:'Удалить чат',danger:true,onClick:async()=>{if(await confirmSheet('Удалить этот чат целиком?','Удалить чат')){deleteMediaOf(chat.messages);S.chats=S.chats.filter(c=>c.id!==chatId);await save('chats');popToRoot();}}},
      ]});
    });
  };
  el.refresh=draw;draw();
}

/* =====================================================
   ЭКРАН: редактор персонажа
   ===================================================== */
function characterEditor(el,charId,opts={}){
  const isNew=!charId;
  const src=charId?charById(charId):null;
  const d=src?JSON.parse(JSON.stringify(src)):{id:uid(),name:'',personality:'',photos:[],createdAt:Date.now()};
  const draw=()=>{
    el.innerHTML=topbar(isNew?'Новый контакт':'Контакт',{right:`<button class="link" data-save style="font-weight:600">Готово</button>`})+`<div class="scroll">
      ${isNew?'':`<button class="btn" data-newchat style="margin-top:16px">Начать новый чат</button>`}
      <div class="group-title">Фото</div>
      <div class="photos">${d.photos.map((p,i)=>`<div class="ph"><img src="${p.src}"><button class="x" data-del="${i}">×</button><button class="ref ${p.ref?'on':''}" data-ref="${i}">${p.ref?'★ референс':'референс'}</button></div>`).join('')}<button class="ph add" data-addph>+</button></div>

    $$('.ph img',el).forEach((img,i)=>img.onclick=()=>viewer(d.photos.map(p=>p.src),i,{
      action:{label:'Сделать аватаркой',hideOn:0,onClick:(k)=>{const [p]=d.photos.splice(k,1);d.photos.unshift(p);draw();toast('Теперь это аватарка');}}}));
    $('[data-save]',el).onclick=async()=>{
      if(!d.name.trim()){toast('Введите имя');return;}
      d.name=d.name.trim();
      if(isNew)S.characters.push(d);else Object.assign(src,d);
      await save('characters');
      pop();
      if(isNew&&opts.thenChat)setTimeout(()=>push(e=>newChatSetup(e,d.id)),340);
    };
    const dc=$('[data-delchar]',el);
    if(dc)dc.onclick=async()=>{
      const n=S.chats.filter(c=>c.characterId===charId).length;
      if(!await confirmSheet(n?`Удалить контакт и ${n} его чат(ов)?`:'Удалить контакт?','Удалить'))return;
      S.chats.filter(c=>c.characterId===charId).forEach(c=>deleteMediaOf(c.messages));
      S.characters=S.characters.filter(c=>c.id!==charId);S.chats=S.chats.filter(c=>c.characterId!==charId);
      await save('characters');await save('chats');popToRoot();
    };
  };
  draw();
}

    $$('[data-photo]',el).forEach(b=>b.onclick=async()=>{const [f]=await pickFiles('image/*');if(!f)return;try{d.photo=await resizeImage(f,1024);draw();}catch(e){toast(e.message);}});
    const rm=$('[data-rmphoto]',el);if(rm)rm.onclick=()=>{d.photo=null;draw();};
    $('[data-save]',el).onclick=async()=>{
      if(!d.name.trim()){toast('Введите имя');return;}d.name=d.name.trim();
      if(isNew){S.personas.push(d);if(!S.settings.activePersonaId)S.settings.activePersonaId=d.id;}else Object.assign(src,d);
      await save('personas');await save('settings');pop();
    };
    const del=$('[data-del]',el);
    if(del)del.onclick=async()=>{
      if(!await confirmSheet('Удалить персону? Чаты останутся, в них будет использоваться активная персона.','Удалить'))return;
      S.personas=S.personas.filter(p=>p.id!==pid);
      if(S.settings.activePersonaId===pid)S.settings.activePersonaId=S.personas[0].id;
      await save('personas');await save('settings');pop();
    };
  };
  draw();
}

function apiEditor(el,id){
  const st=S.settings;const isNew=!id;const src=id?st.apis.find(a=>a.id===id):null;
  const d=src?JSON.parse(JSON.stringify(src)):{id:uid(),name:'',protocol:'auto',baseUrl:'',key:'',model:'',models:[]};
  let loading=false,showKey=false;
  const draw=()=>{
    const fa=document.activeElement;const focusKey=fa&&el.contains(fa)&&fa.dataset?fa.dataset.f:null;
    drawInner();
    if(focusKey){const i=$(`[data-f="${focusKey}"]`,el);if(i&&i.tagName!=='SELECT'){i.focus();try{i.setSelectionRange(i.value.length,i.value.length);}catch{}}}
  };
  const drawInner=()=>{
    const models=d.models||[];
    el.innerHTML=topbar(isNew?'Новое подключение':'Подключение',{right:`<button class="link" data-save style="font-weight:600">Готово</button>`})+`<div class="scroll">
      <div class="group">
        <div class="field"><label>Название</label><input data-f="name" value="${esc(d.name)}" placeholder="Например, Gemini через linkapi"></div>
        <div class="field"><label>Протокол</label><div class="selectwrap"><select data-f="protocol">${Object.entries(PROTO_NAMES).map(([k,v])=>`<option value="${k}" ${d.protocol===k?'selected':''}>${v}</option>`).join('')}</select></div>
          ${d.protocol==='auto'&&d.baseUrl?`<div class="hint">Сейчас определяется как: ${PROTO_NAMES[protocolOf(d)]}</div>`:''}</div>
        <div class="field"><label>Адрес (API base URL)</label><input data-f="baseUrl" value="${esc(d.baseUrl)}" placeholder="https://…/v1beta или https://…/v1" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
        <div class="field"><label>Ключ (API key)</label><div style="display:flex;gap:8px;align-items:center"><input data-f="key" type="${showKey?'text':'password'}" value="${esc(d.key)}" placeholder="sk-…" autocapitalize="off" autocorrect="off" spellcheck="false"><button data-eye style="color:var(--accent);font-size:14px;flex:none">${showKey?'скрыть':'показать'}</button></div>
          <div class="hint">Ключ хранится только на этом телефоне.</div></div>
      </div>
      <div class="group-title">Модель</div>
      <div class="group">
        ${models.length?`<div class="field"><label>Выберите из списка (${models.length})</label><div class="selectwrap"><select data-model>${!d.model||!models.includes(d.model)?`<option value="">${d.model?'— своя: '+esc(d.model)+' —':'— выберите модель —'}</option>`:''}${models.map(m=>`<option value="${esc(m)}" ${d.model===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div></div>`:''}
        <div class="field"><label>${models.length?'Или впишите вручную':'Название модели'}</label><input data-f="model" value="${esc(d.model)}" placeholder="например, gemini-2.5-pro" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      </div>
      <button class="btn secondary" data-load ${loading?'disabled':''}>${loading?'<span class="spin"></span> Загружаю…':'Загрузить список моделей'}</button>
      <button class="btn secondary" data-test>Проверить подключение</button>
      ${isNew?'':'<button class="btn danger" data-del>Удалить подключение</button>'}
    </div>`;
    bindBack(el);
    $$('[data-f]',el).forEach(i=>{
      i.oninput=()=>{d[i.dataset.f]=i.value;};
      if(i.tagName==='SELECT')i.onchange=()=>{d[i.dataset.f]=i.value;draw();};
      if(i.dataset.f==='baseUrl'||i.dataset.f==='key')i.onblur=()=>{if(d.baseUrl&&d.key&&!(d.models||[]).length&&!loading)loadModels(true);};
    });
    const ms=$('[data-model]',el);if(ms)ms.onchange=()=>{if(ms.value){d.model=ms.value;draw();}};
    $('[data-eye]',el).onclick=()=>{showKey=!showKey;draw();};
    $('[data-load]',el).onclick=()=>loadModels(false);
    $('[data-test]',el).onclick=async()=>{
      const b=$('[data-test]',el);b.disabled=true;b.innerHTML='<span class="spin"></span> Проверяю…';
      try{const r=await callModel(d,'Ты проверка связи. Ответь коротко.',[{role:'user',text:'Скажи «работает».'}]);toast('✅ Ответ модели: '+r.slice(0,80),4000);}
      catch(e){toast('❌ '+e.message,7000);}
      b.disabled=false;b.textContent='Проверить подключение';
    };
    $('[data-save]',el).onclick=async()=>{
      d.baseUrl=d.baseUrl.trim();d.key=d.key.trim();d.model=cleanModel(d.model);

      await save('settings');pop();
    };
    const del=$('[data-del]',el);

      st.apis=st.apis.filter(a=>a.id!==id);if(st.activeApiId===id)st.activeApiId=st.apis[0]?st.apis[0].id:null;await save('settings');pop();};
  };
  async function loadModels(silent){
    if(!d.baseUrl||!d.key){if(!silent)toast('Сначала впишите адрес и ключ');return;}
    loading=true;draw();

    catch(e){if(!silent)toast('Не удалось загрузить модели: '+e.message,6000);}
    loading=false;draw();
  }
  draw();
}

function memoryEditor(el){
